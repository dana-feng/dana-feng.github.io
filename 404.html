<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>dana feng</title>
  <script>
    // GitHub Pages has no server-side fallback for client-side routes, so a
    // direct load of e.g. /art hits this 404 page. Re-encode the path into a
    // query string and redirect to index.html, which decodes it back on load
    // (see the matching script in index.html) — standard SPA-on-GH-Pages fix.
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      '/?/' + l.pathname.slice(1).replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
